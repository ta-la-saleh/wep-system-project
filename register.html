<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <link href="photo/logo-1.png" type="img/x-icon" rel="icon">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <title>Create Account</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="page-content">

    <header class="navbar">

        <div class="logo-box">
            <img src="photo/logo2.png" class="logo-img">
            <span class="logo-text">
                <span class="part1">Devora</span>
                <span class="part2">course</span>
            </span>
        </div>

        <div class="search-box">
            <img src="photo/search1.png" class="search-icon">
            <input type="text" placeholder="Search for courses...">
            <button class="search-button">Search</button>
        </div>

        <div class="nav-left">
            <span class="home-pos">
                <a href="Home.html" class="nav-home">
                    <img src="photo/HOME2.png" class="home-icon">
                </a>
                <a href="Home.html" class="nav-home">
                    <span class="nav-item">Home</span>
                </a>
            </span>

            <span class="divider"></span>

            <span id="profileBtn" class="Profile">
                <img src="photo/profile1.png" class="profile-icon">
                <span class="nav-item">Profile</span>
            </span>
        </div>

    </header>

    <form>
        <div class="container">
            <div class="card">

                <div class="icon-circle">
                    <i class="fa fa-user-plus"></i>
                </div>

                <h2>Create Your Account</h2>
                <p>Fill in your details to get started</p>

                <div class="input-group">
                    <i class="fa fa-user"></i>
                    <input type="text" placeholder="Enter your User name">
                </div>

                <div class="input-group">
                    <i class="fa fa-phone"></i>
                    <input type="tel" placeholder="05********">
                </div>

                <div class="input-group">
                    <i class="fa fa-envelope"></i>
                    <input type="email" placeholder="example@mail.com">
                </div>

                <div class="input-group">
                    <i class="fa fa-lock"></i>
                    <input type="password" placeholder="**********">
                </div>

                <button class="btn">Create Account</button>

            </div>
        </div>
    </form>

</div>

<footer class="nav-footer">
    <div class="logo-box">
        <img src="photo/logo2.png" class="logo-img">
        <span class="logo-text">
            <span class="part1">Devora</span>
            <span class="part2">course</span>
        </span>
    </div>
</footer>

</body>
</html>
