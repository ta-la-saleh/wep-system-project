 <link rel="stylesheet" href="style.css">
<div class="login-modal" id="loginModal">
    <div class="login-box">
        

        <header class="login-header">
            <h1>EDUCATIONAL COURSES</h1>
            <p>مرحباً بك، يرجى تسجيل الدخول للمتابعة</p>
        </header>

        <form id="loginForm" action="index.html" method="POST" onsubmit="return validateLogin()">
            <div class="input-group">
                <label for="username">اسم المستخدم:</label>
                <input type="text" id="username" name="username" placeholder="أدخل اسم المستخدم">
                <span id="userError" class="error-msg"></span>
            </div>

            <div class="input-group">
                <label for="password">كلمة المرور:</label>
                <input type="password" id="password" name="password" placeholder="أدخل كلمة المرور">
                <span id="passError" class="error-msg"></span>
            </div>

            <button type="submit" class="login-btn">دخول</button>

            <div class="form-footer">
                <p>ليس لديك حساب؟ <a href="register.html">سجل الآن</a></p>
            </div>
        </form>

        <span class="close-modal" id="closeModal">×</span>
    </div>
</div>
